name: Build Android with bob

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - armv7-android
          - arm64-android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve stable Defold version
        id: defold
        shell: bash
        run: |
          version=$(curl -fsSL https://d.defold.com/stable/info.json | jq -r .sha1)
          test -n "$version"
          test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache bob.jar
        id: bob-cache
        uses: actions/cache@v6
        with:
          path: bob.jar
          key: bob-stable-${{ steps.defold.outputs.version }}

      - name: Download bob.jar
        if: steps.bob-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o bob.jar \
            "https://d.defold.com/archive/${{ steps.defold.outputs.version }}/bob/bob.jar"

      - name: Resolve project dependencies
        id: resolve
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          java -jar bob.jar resolve 2>&1 | tee resolve.log

      - name: Build
        id: build
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: >-
          java -jar bob.jar
          --platform=${{ matrix.platform }}
          --architectures=${{ matrix.platform }}
          --build-server=https://build-stage.defold.com
          build --archive

      - name: Report bob failure
        if: steps.resolve.outcome == 'failure' || steps.build.outcome == 'failure'
        shell: bash
        run: |
          if [[ "${{ steps.resolve.outcome }}" == "failure" ]]; then
            log_file=resolve.log
          else
            log_file=$(find build -type f -name log.txt -print -quit)
          fi
          if [[ -n "$log_file" ]]; then
            tail -c 50000 "$log_file"
            message=$(tail -c 50000 "$log_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Defold bob build failed::$message"
          else
            echo "::error title=Defold bob build failed::bob exited with code 1 and did not create build/log.txt"
          fi
          exit 1
